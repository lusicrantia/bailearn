 {% extends 'base.html' %}


 {% block title %} Register {% endblock %}

 {% block page_styles %}
 <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/register.css') }}">
 {% endblock %}

 {% block content %} 
 <div class="auth-container register-page">
    <div class="auth-card">
        <h1 class="auth-title">Create an account</h1>
        <p class="auth-subtitle">Set up your learning space.</p>

        <form method="POST" class="auth">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="username" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="password" name="password" placeholder="Create a password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password" class="confirm_password" name="confirm_password" placeholder="Enter your password again" required>
            </div>

            <button type="submit">Create account</button>
        </form>

        <p>
            Already have an account? <a href="{{ url_for('login')}}">Log in</a>
        </p>

    </div>
 </div>
 
 {% endblock %}
