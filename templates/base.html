<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{% block title %}BaiLearn{% endblock %} </title>
</head>
<body>
     <div class="site-shell">
        <nav class="nav-bar">
            <div class="container-nav">
                <div class="site-name">
                    <span class="brand-mark" aria-hidden="true"></span>
                    <span>BaiLearn</span>
                </div>

                <button class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <div class="nav-links">
                 {% if current_user.is_authenticated %}
                    <a href="{{ url_for('dashboard') }}">Dashboard</a>
                    <a href="{{ url_for('brain_dump')}}">Brain Dump Box </a>
                    <a href="{{ url_for('focus_timer')}}">Focus Timer </a>
                    <a href="{{ url_for('decision_journal')}}">Decision Journal </a>
                    <a href="{{ url_for('flashcard') }}">Flashcards</a>

                    <a href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a href="{{ url_for('login') }}">Login</a>
                    <a href="{{ url_for('register') }}">Register</a>
                {% endif %}
                </div>
            </div>
        </nav>
     </div>

     <main>
        {% block content %}

        {% endblock %}
     </main>
</body>
</html>
