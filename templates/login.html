{% extends 'base.html' %}

{% block title %} Login {% endblock %}

{% block page_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/login.css') }}">
{% endblock %}

{% block content %} 

<div class="auth-container login-page">
    <div class="auth-card">
        <h1 class="auth-title">Log in</h1>
        <p>Continue to your learning space.</p>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit">Log in</button>
        </form>

    <p>New here? <a href="{{ url_for('register') }}">Create an account</a>.
    </p>

    </div>
</div>



{% endblock %}
