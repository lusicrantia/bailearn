{% extends 'base.html' %}

{% block title %} Login {% endblock %}


{% block content %} 

<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Login</h2>
        <p>Welcome! Please login your credentials</p>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username" >Username</label>
                <input type="text" id="username" class="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password" >Password</label>
                <input type="password" id="Password" class="Password" name="password" placeholder="Enter your password" required>
            </div>

            <button class="btn-primary">Submit</button>
        </form>

    <p>Don't you have an account yet? <a href="{{ url_for('register')}}">Create one.</a>
    </p>

    </div>
</div>



{% endblock %}
